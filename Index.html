<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pracownia+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#21262B;
    --plaster:#E7E2D9;
    --surface:#FBF9F5;
    --surface-2:#F2EEE6;
    --accent:#2E5D5A;
    --accent-soft:#DCE6E4;
    --brass:#B8863B;
    --brass-soft:#F0E4CC;
    --muted:#8B8478;
    --border:rgba(33,38,43,0.13);
    --border-strong:rgba(33,38,43,0.24);
    --radius:7px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',sans-serif;
    background:var(--plaster);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:64px 24px 40px;
  }
  .display{font-family:'Fraunces',serif}

  .wordmark{
    font-family:'Fraunces',serif;
    font-size:40px;
    font-weight:600;
    letter-spacing:-0.01em;
    display:flex;
    align-items:baseline;
    gap:2px;
  }
  .wordmark .plus{color:var(--brass)}
  .tagline{
    margin-top:10px;
    font-size:14px;
    color:var(--muted);
    max-width:340px;
    text-align:center;
    line-height:1.5;
  }

  .shelf{
    margin-top:56px;
    width:100%;
    max-width:760px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:18px;
  }

  .tile{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:26px 22px 22px;
    display:flex;
    flex-direction:column;
    gap:8px;
    text-decoration:none;
    color:var(--ink);
    position:relative;
    transition:border-color .15s, transform .15s;
    min-height:150px;
    cursor:pointer;
  }
  .tile:hover{
    border-color:var(--border-strong);
    transform:translateY(-2px);
  }
  .tile:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .tile .mark{
    width:34px;
    height:34px;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:15px;
    color:#fff;
  }
  .tile .name{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:600;
    letter-spacing:-0.005em;
    margin-top:8px;
  }
  .tile .desc{
    font-size:13px;
    color:var(--muted);
    line-height:1.5;
  }

  .tile.licznik .mark{background:var(--accent)}
  .tile.panel .mark{background:var(--brass)}

  .tile.add{
    align-items:center;
    justify-content:center;
    text-align:center;
    border:1.5px dashed var(--border-strong);
    background:transparent;
    color:var(--muted);
    cursor:default;
  }
  .tile.add:hover{
    transform:none;
    border-color:var(--border-strong);
  }
  .tile.add .plus-icon{
    font-size:22px;
    font-family:'Fraunces',serif;
    color:var(--muted);
    line-height:1;
  }
  .tile.add .desc{
    margin-top:2px;
    color:var(--muted);
  }

  footer{
    margin-top:auto;
    padding-top:56px;
    font-size:11px;
    color:var(--muted);
    letter-spacing:.01em;
  }

  /* ---------- Module view (in-page, embedded, no navigation) ---------- */
  #home-view{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  body.module-open{
    padding:0;
    align-items:stretch;
  }
  body.module-open #home-view{
    display:none;
  }
  #module-view{
    display:none;
    width:100%;
    height:100vh;
    flex-direction:column;
  }
  body.module-open #module-view{
    display:flex;
  }
  #module-bar{
    height:44px;
    flex-shrink:0;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 16px;
  }
  #module-back{
    display:flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    padding:6px 8px;
    border-radius:6px;
  }
  #module-back:hover{background:var(--surface-2)}
  #module-label{
    font-size:12px;
    color:var(--muted);
    border-left:1px solid var(--border);
    padding-left:12px;
  }
  #module-frame{
    flex:1;
    width:100%;
    border:none;
    background:var(--surface);
  }
</style>
</head>
<body>

  <div id="home-view">
    <div class="wordmark">Pracownia<span class="plus">+</span></div>
    <p class="tagline">Narzędzia pracy Better Home Interior Design,<br>w jednym miejscu.</p>

    <div class="shelf">
      <div class="tile licznik" data-name="Licznik osprzętu" data-target="licznik" onclick="openModule(this)" role="button" tabindex="0">
        <div class="mark">L</div>
        <div class="name">Licznik osprzętu</div>
        <div class="desc">Zliczanie i oznaczanie elementów na planach projektów</div>
      </div>

      <div class="tile panel" data-name="Panel zadań" data-target="panel" onclick="openModule(this)" role="button" tabindex="0">
        <div class="mark">P</div>
        <div class="name">Panel zadań</div>
        <div class="desc">Zadania, wykonawcy i postępy projektów w jednym widoku</div>
      </div>

      <div class="tile add">
        <div class="plus-icon">+</div>
        <div class="desc">Kolejny moduł<br>wkrótce</div>
      </div>
    </div>

    <footer>Pracownia+</footer>
  </div>

  <div id="module-view">
    <div id="module-bar">
      <button id="module-back" onclick="closeModule()">&#8592; Pracownia+</button>
      <span id="module-label"></span>
    </div>
    <iframe id="module-frame" title="Moduł Pracownia+"></iframe>
  </div>

  <script>
    var MODULES = {
      licznik: document.getElementById('app-licznik-b64').textContent,
      panel:   document.getElementById('app-panel-b64').textContent
    };

    function b64ToUtf8(b64){
      var binary = atob(b64);
      var bytes = new Uint8Array(binary.length);
      for(var i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
      return new TextDecoder('utf-8').decode(bytes);
    }

    function openModule(el){
      var target = el.getAttribute('data-target');
      var html = b64ToUtf8(MODULES[target]);
      var frame = document.getElementById('module-frame');
      frame.srcdoc = html;
      document.getElementById('module-label').textContent = el.getAttribute('data-name');
      document.body.classList.add('module-open');
      history.pushState({module:target}, '', '#' + target);
    }
    function closeModule(){
      document.body.classList.remove('module-open');
      document.getElementById('module-frame').srcdoc = '';
      history.pushState({module:false}, '', location.pathname);
    }
    window.addEventListener('popstate', function(){
      if(document.body.classList.contains('module-open')) closeModule();
    });

    document.querySelectorAll('.tile[data-target]').forEach(function(t){
      t.addEventListener('keydown', function(e){
        if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openModule(t); }
      });
    });
  </script>
